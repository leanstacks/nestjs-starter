# ==================================================================================================
# Workflow Name: Teardown (Manual)
# Description: A workflow for manually tearing down the infrastructure in different environments.
#
# Maintainer: NestJS API Team
# Downstreams: None
#
# Security Considerations: Ensure that sensitive information such as
#                          AWS credentials and environment variables are
#                          handled securely and cleaned up after the workflow completes.
# References: See DevOps Guide at docs/devops-guide.md
# ==================================================================================================
name: Teardown (Manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to teardown'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prd

concurrency:
  group: teardown-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  teardown:
    name: Teardown infrastructure in ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      id-token: write

    steps:
      # --- Setup ---
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.environment == 'dev' && vars.AWS_ROLE_ARN_DEV || inputs.environment == 'qa' && vars.AWS_ROLE_ARN_QA || vars.AWS_ROLE_ARN_PRD }}
          role-session-name: teardown-nestjs-starter-${{ inputs.environment }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install dependencies
        run: npm ci

      - name: Create infrastructure .env file
        working-directory: ./packages/infra
        run: |
          echo "${{ inputs.environment == 'dev' && vars.CDK_ENV_DEV || inputs.environment == 'qa' && vars.CDK_ENV_QA || vars.CDK_ENV_PRD }}" > .env
          echo "✅ Infrastructure .env file created"

      # --- Build ---
      - name: Synthesize CDK stacks
        run: npm run synth --workspace packages/infra

      # --- Teardown ---
      - name: Destroy all stacks
        run: |
          echo "🚀 Destroying all stacks..."
          npm run destroy --workspace packages/infra -- --all --force
          echo "✅ All stacks destroyed successfully"
