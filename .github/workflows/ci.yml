# ==================================================================================================
# Workflow Name: Continuous Integration
# Description: Continuous Integration workflow for building, linting, and
#              testing the project, as well as synthesizing infrastructure stacks.
#
# Maintainer: NestJS API Team
# Downstreams: None
#
# Security Considerations: Ensure that sensitive information such as
#                          AWS credentials and environment variables are
#                          handled securely and cleaned up after the workflow completes.
# References: See DevOps Guide at docs/devops-guide.md
# ==================================================================================================
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      # --- Setup ---
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create infrastructure .env file
        working-directory: ./packages/infra
        run: |
          echo "${{ vars.CDK_ENV_DEV }}" > .env

      # --- Project Checks ---
      - name: Lint code
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Build application
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage

      # --- Infrastructure Package Checks ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          role-session-name: ci-nestjs-starter
          aws-region: ${{ vars.AWS_REGION }}

      - name: Synthesize CDK stacks
        run: npm run synth --workspace packages/infra

      # --- Final Step: Clean up sensitive files ---
      - name: Clean up sensitive files
        if: always()
        run: |
          echo "🧹 Cleaning up sensitive files..."
          rm -f packages/api/.env
          rm -rf packages/api/dist
          rm -f packages/infra/.env
          rm -rf packages/infra/dist
          rm -rf packages/infra/cdk.out
          echo "✅ Sensitive files cleaned up"
