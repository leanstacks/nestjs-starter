# ==================================================================================================
# Workflow Name: Release (Reusable)
# Description: A reusable workflow for releasing the project to different environments.
#
# Maintainer: NestJS API Team
# Downstreams: None
#
# Security Considerations: Ensure that sensitive information such as
#                          AWS credentials and environment variables are
#                          handled securely and cleaned up after the workflow completes.
# References: See DevOps Guide at docs/devops-guide.md
# ==================================================================================================
name: Release (Reusable)

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Container image tag to deploy'
        required: true
        type: string
      environment:
        description: 'Environment to deploy (dev, qa, prd)'
        required: true
        type: string
      aws_region:
        description: 'AWS region for deployment'
        required: true
        type: string
      aws_role_arn:
        description: 'AWS IAM role ARN for deployment'
        required: true
        type: string
      cdk_env_content:
        description: 'CDK environment configuration content'
        required: true
        type: string

jobs:
  release:
    name: Release to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      # --- Setup ---
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          role-session-name: release-nestjs-starter-${{ inputs.environment }}
          aws-region: ${{ inputs.aws_region }}

      - name: Install dependencies
        run: npm ci

      - name: Create infrastructure .env file
        working-directory: ./packages/infra
        run: |
          echo "${{ inputs.cdk_env_content }}" > .env

      # --- Build ---
      - name: Build infrastructure
        run: npm run build

      - name: Synthesize CDK stacks
        run: npm run synth --workspace packages/infra

      # --- Deploy ---
      - name: Deploy Network stack
        run: |
          echo "🚀 Deploying Network stack..."
          npm run deploy --workspace packages/infra -- nestjs-starter-network-${{ inputs.environment }} --require-approval never
          echo "✅ Network stack deployed successfully"

      - name: Deploy Database stack
        run: |
          echo "🚀 Deploying Database stack..."
          npm run deploy --workspace packages/infra -- nestjs-starter-database-${{ inputs.environment }} --require-approval never
          echo "✅ Database stack deployed successfully"

      - name: Deploy Compute stack
        run: |
          echo "🚀 Deploying Compute stack..."
          npm run deploy --workspace packages/infra -- nestjs-starter-compute-${{ inputs.environment }} --require-approval never --context appVersion=${{ inputs.image_tag }}
          echo "✅ Compute stack deployed successfully"

      - name: Deploy Scheduled Task stack
        run: |
          echo "🚀 Deploying Scheduled Task stack..."
          npm run deploy --workspace packages/infra -- nestjs-starter-scheduled-task-${{ inputs.environment }} --require-approval never --context appVersion=${{ inputs.image_tag }}
          echo "✅ Scheduled Task stack deployed successfully"

      - name: Update ECS API service
        run: |
          CLUSTER_NAME="nestjs-starter-${{ inputs.environment }}"
          SERVICE_NAME="nestjs-starter-${{ inputs.environment }}"

          echo "🔄 Forcing ECS service update with image tag: ${{ inputs.image_tag }}"
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --force-new-deployment \
            --region ${{ inputs.aws_region }}

          echo "✅ ECS API service update triggered"

      - name: Update ECS Scheduled Task service
        run: |
          CLUSTER_NAME="nestjs-starter-${{ inputs.environment }}"
          SERVICE_NAME="nestjs-starter-scheduler-${{ inputs.environment }}"

          echo "🔍 Checking if scheduled task service exists..."
          if aws ecs describe-services \
            --cluster $CLUSTER_NAME \
            --services $SERVICE_NAME \
            --region ${{ inputs.aws_region }} \
            --query 'services[?status==`ACTIVE`].serviceName' \
            --output text | grep -q "$SERVICE_NAME"; then
            
            echo "✅ Scheduled task service found"
            echo "🔄 Forcing ECS service update with image tag: ${{ inputs.image_tag }}"
            aws ecs update-service \
              --cluster $CLUSTER_NAME \
              --service $SERVICE_NAME \
              --force-new-deployment \
              --region ${{ inputs.aws_region }}

            echo "✅ ECS scheduled task service update triggered"
          else
            echo "⚠️ Scheduled task service not found or not active, skipping"
          fi

      # --- Final Step: Clean up sensitive files ---
      - name: Clean up sensitive files
        if: always()
        run: |
          echo "🧹 Cleaning up sensitive files..."
          rm -f packages/api/.env
          rm -rf packages/api/dist
          rm -f packages/infra/.env
          rm -rf packages/infra/dist
          rm -rf packages/infra/cdk.out
          echo "✅ Sensitive files cleaned up"
