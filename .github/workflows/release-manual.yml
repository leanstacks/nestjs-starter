# ==================================================================================================
# Workflow Name: Release (Manual)
# Description: A workflow for manually releasing the project to different environments.
#
# Maintainer: NestJS API Team
# Downstreams: None
#
# Security Considerations: Ensure that sensitive information such as
#                          AWS credentials and environment variables are
#                          handled securely and cleaned up after the workflow completes.
# References: See DevOps Guide at docs/devops-guide.md
# ==================================================================================================
name: Release (Manual)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Container image tag to deploy (e.g., 0.1.0-build.123.abc1234, or latest)'
        required: true
        type: string
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prd

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.image_tag }} to ${{ inputs.environment }}
    uses: ./.github/workflows/release-reusable.yml
    with:
      image_tag: ${{ inputs.image_tag }}
      environment: ${{ inputs.environment }}
      aws_region: ${{ vars.AWS_REGION }}
      aws_role_arn: ${{ inputs.environment == 'dev' && vars.AWS_ROLE_ARN_DEV || inputs.environment == 'qa' && vars.AWS_ROLE_ARN_QA || vars.AWS_ROLE_ARN_PRD }}
      cdk_env_content: ${{ inputs.environment == 'dev' && vars.CDK_ENV_DEV || inputs.environment == 'qa' && vars.CDK_ENV_QA || vars.CDK_ENV_PRD }}
    permissions:
      contents: read
      id-token: write
