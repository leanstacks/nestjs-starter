# ==================================================================================================
# Workflow Name: Code Quality
# Description: Code Quality workflow for linting, formatting, and testing the project.
#
# Maintainer: NestJS API Team
# Downstreams: None
#
# Security Considerations: Ensure that sensitive information such as
#                          AWS credentials and environment variables are
#                          handled securely and cleaned up after the workflow completes.
# References: See DevOps Guide at docs/devops-guide.md
# ==================================================================================================
name: Code Quality

on:
  schedule:
    # Run weekly on Sundays at 5:10 AM UTC
    - cron: '10 5 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/src/**'
      - '**/package.json'
      - '**/tsconfig.json'
      - '.github/workflows/**'

jobs:
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # --- Setup --
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- Project Checks ---
      - name: Run lint analysis with detailed output
        run: |
          echo "## Lint Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npm run lint > lint-output.txt || true
          if [ $? -eq 0 ]; then
            echo "✅ No lint issues found" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Issues Found:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat lint-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check code formatting
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Prettier Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npm run format:check > prettier-output.txt 2>&1 || true
          if [ $? -eq 0 ]; then
            echo "✅ All files are properly formatted" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Issues Found:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat prettier-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build check
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npm run build > build-output.txt 2>&1
          if [ $? -eq 0 ]; then
            echo "✅ Build successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Issues Found:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Security audit
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level moderate --omit dev > security-output.txt 2>&1 || true

          if grep -q "found 0 vulnerabilities" security-output.txt; then
            echo "✅ No security vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Issues Found:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat security-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Package analysis
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Package Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for outdated packages
          echo "### Outdated Packages:" >> $GITHUB_STEP_SUMMARY
          npm outdated > outdated-output.txt 2>&1 || true
          if [ -s outdated-output.txt ]; then
            echo "### Issues Found:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat outdated-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All packages are up to date" >> $GITHUB_STEP_SUMMARY
          fi

      ### --- API Package Checks ---
      - name: Run API package tests with detailed coverage
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## API Package Test Coverage Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npm run test:coverage --workspace packages/api

          # Extract coverage summary
          if [ -f packages/api/coverage/coverage-summary.json ]; then
            echo "### API Package Coverage Summary:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Use Node.js to parse JSON and create a table
            node -e "
              const fs = require('fs');
              const coverage = JSON.parse(fs.readFileSync('packages/api/coverage/coverage-summary.json', 'utf8'));
              const total = coverage.total;
              
              console.log('| Metric | Percentage | Covered/Total |');
              console.log('|--------|------------|---------------|');
              console.log(\`| Lines | \${total.lines.pct}% | \${total.lines.covered}/\${total.lines.total} |\`);
              console.log(\`| Functions | \${total.functions.pct}% | \${total.functions.covered}/\${total.functions.total} |\`);
              console.log(\`| Branches | \${total.branches.pct}% | \${total.branches.covered}/\${total.branches.total} |\`);
              console.log(\`| Statements | \${total.statements.pct}% | \${total.statements.covered}/\${total.statements.total} |\`);
            " >> $GITHUB_STEP_SUMMARY
          fi

      ### --- Infrastructure Package Checks ---
      - name: Run infra package tests with detailed coverage
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Infrastructure Package Test Coverage Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npm run test:coverage --workspace packages/infra

          # Extract coverage summary
          if [ -f packages/infra/coverage/coverage-summary.json ]; then
            echo "### Infrastructure Package Coverage Summary:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Use Node.js to parse JSON and create a table
            node -e "
              const fs = require('fs');
              const coverage = JSON.parse(fs.readFileSync('packages/infra/coverage/coverage-summary.json', 'utf8'));
              const total = coverage.total;
              
              console.log('| Metric | Percentage | Covered/Total |');
              console.log('|--------|------------|---------------|');
              console.log(\`| Lines | \${total.lines.pct}% | \${total.lines.covered}/\${total.lines.total} |\`);
              console.log(\`| Functions | \${total.functions.pct}% | \${total.functions.covered}/\${total.functions.total} |\`);
              console.log(\`| Branches | \${total.branches.pct}% | \${total.branches.covered}/\${total.branches.total} |\`);
              console.log(\`| Statements | \${total.statements.pct}% | \${total.statements.covered}/\${total.statements.total} |\`);
            " >> $GITHUB_STEP_SUMMARY
          fi

      # --- Cleanup and Archiving ---
      - name: Clean up sensitive files
        if: always()
        run: |
          echo "🧹 Cleaning up sensitive files..."
          rm -f packages/api/.env
          rm -rf packages/api/dist
          rm -f packages/infra/.env
          rm -rf packages/infra/dist
          rm -rf packages/infra/cdk.out
          echo "✅ Sensitive files cleaned up"

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            packages/api/coverage/
            packages/infra/coverage/
            lint-output.txt
            prettier-output.txt
            build-output.txt
            security-output.txt
            outdated-output.txt
          retention-days: 7
